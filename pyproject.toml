[project]
name = "who-is-running"
version = "0.1.0"
description = "Collect who is running in US elections (federal, state, local) from free public sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
who-is-running = "who_is_running.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who_is_running"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
